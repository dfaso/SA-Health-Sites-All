<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SA Health Sites - Waste</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- MapLibre -->
  <link
    href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <!-- Sticky Header -->
  <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid px-4">
      <span class="navbar-brand mb-0 h1">
        SA Health Sites - Waste
      </span>
    </div>
  </nav>


  <!-- Main Page Content -->
  <main class="container-fluid py-4">

    <!-- Map -->
    <div id="map"></div>


    <!-- Map Control Bar -->
    <div id="map-toolbar" class="bg-dark text-white shadow-sm">

      <div class="row g-3 align-items-end">

        <!-- Site Count -->
        <div class="col-12 col-md-auto me-md-auto">

          <div class="small text-white-50">
            Sites shown
          </div>

          <div
            id="site-count"
            class="fs-4 fw-semibold">
            0
          </div>

        </div>


        <!-- Governing LHN -->
        <div class="col-12 col-md-3">

          <label
            for="governing-lhn-filter"
            class="form-label small mb-1">
            Governing LHN
          </label>

          <select
            id="governing-lhn-filter"
            class="form-select form-select-sm">

            <option value="">
              All
            </option>

          </select>

        </div>


        <!-- Geographical LHN -->
        <div class="col-12 col-md-3">

          <label
            for="geographical-lhn-filter"
            class="form-label small mb-1">
            Geographical LHN
          </label>

          <select
            id="geographical-lhn-filter"
            class="form-select form-select-sm">

            <option value="">
              All
            </option>

          </select>

        </div>


        <!-- Search -->
        <div class="col-12 col-md-3">

          <label
            for="site-search"
            class="form-label small mb-1">
            Search
          </label>

          <input
            id="site-search"
            type="search"
            class="form-control form-control-sm"
            placeholder="Site, suburb, address..."
          >

        </div>


        <!-- Reset -->
        <div class="col-6 col-md-auto">

          <button
            id="reset-button"
            class="btn btn-outline-light btn-sm w-100">

            Show All / Reset View

          </button>

        </div>


        <!-- Export -->
        <div class="col-6 col-md-auto">

          <button
            id="export-button"
            class="btn btn-primary btn-sm w-100">

            Export CSV

          </button>

        </div>

      </div>

    </div>


    <!-- Table -->
    <div id="table-container" class="mt-4">

      <table
        id="sites-table"
        class="table table-striped table-hover table-bordered">
      </table>

    </div>

  </main>


  <!-- Bootstrap -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- MapLibre -->
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

  <!-- Map -->
  <script src="./js/map.js"></script>

</body>
</html>
